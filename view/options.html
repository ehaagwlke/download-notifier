<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Options</title>
    <link rel="stylesheet" href="/style/options.css" />
</head>
<body>
    <main class="o-page">
        <div class="o-row">
            <input type="checkbox" name="soundAlert" id="soundAlert">
            <label for="soundAlert" id="soundAlertLabel"></label>
        </div>

        <div id="sounds" class="o-sub">
            <div class="o-row">
                <span id="trackLabel" class="o-label"></span>
                <select name="alertSound" id="alertSound">
                    <option value=0>Elevator Ding</option>
                    <option value=1>Air Plane Ding</option>
                    <option value=2>Pop Clip In</option>
                    <option value=3>Ship Bell</option>
                    <option value=4>Store Door Chime</option>
                    <option value=5>Temple Bell</option>
                </select>
                <img src="/img/play.png" alt="play sound" class="mediaControl" id="mediaControl" />
            </div>

            <div class="o-row">
                <span id="volLabel" class="o-label"></span>
                <input type="range" name="volumeOfSound" id="volumeOfSound" min="0.00" max="1.00" step="0.01" value="" />
                <span id="volValue" class="o-value"></span>
            </div>
            <p id="volNotes" class="o-note"></p>
        </div>

        <div class="o-row">
            <label for="themeSelect" id="themeLabel" class="o-label"></label>
            <select name="theme" id="themeSelect">
                <option value="auto" id="themeAuto"></option>
                <option value="light" id="themeLight"></option>
                <option value="dark" id="themeDark"></option>
            </select>
        </div>

        <div class="o-row">
            <label for="iconStyleSelect" id="iconStyleLabel" class="o-label"></label>
            <select name="iconStyle" id="iconStyleSelect">
                <option value="auto" id="iconStyleAuto"></option>
                <option value="dark" id="iconStyleDark"></option>
                <option value="light" id="iconStyleLight"></option>
            </select>
        </div>

        <div class="o-row">
            <input type="checkbox" name="autoOpenPopup" id="autoOpenPopup">
            <label for="autoOpenPopup" id="autoOpenPopupLabel"></label>
        </div>

        <div class="o-row">
            <input type="checkbox" name="showDownloadShelf" id="showDownloadShelf">
            <label for="showDownloadShelf" id="showDownloadShelfLabel"></label>
        </div>
    </main>

    <script src="/js/consts.js"></script>
    <script src="/js/options.js"></script>
</body>
</html>
